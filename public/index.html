<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Field Notes</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="favicon.ico" sizes="32x32" />
<link rel="icon" type="image/png" href="icon-32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="icon-192.png" sizes="192x192" />
<!-- Safari on iOS ignores SVG favicons and data: URLs, and falls back to the
     origin root — where the other app on this host answers. A real PNG at a
     path of our own is what keeps the mushroom on the bookmark. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
</head>
<body>

<header class="masthead">
  <div class="masthead-title">
    <h1 id="masthead-title">Field Notes <span class="masthead-emoji" role="img" aria-label="mushroom">🍄</span></h1>
  </div>
  <div class="masthead-chips">
    <div class="chip">
      <span class="chip-label">Finds</span>
      <span class="chip-value" data-num id="chip-finds">—</span>
      <span class="chip-source">logged</span>
    </div>
    <div class="chip">
      <span class="chip-label">Identified</span>
      <span class="chip-value" data-num id="chip-identified">—</span>
      <span class="chip-source" id="chip-identified-source">—</span>
    </div>
    <div class="chip">
      <span class="chip-label">Species</span>
      <span class="chip-value" data-num id="chip-species">—</span>
      <span class="chip-source" id="chip-species-source">—</span>
    </div>
    <div class="chip is-text">
      <span class="chip-label">Last find</span>
      <span class="chip-value" id="chip-last">—</span>
      <span class="chip-source" id="chip-last-source">—</span>
    </div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" class="tab is-active" data-view="log">Log</button>
  <button role="tab" class="tab" data-view="species">Species</button>
  <button role="tab" class="tab" data-view="glossary">Glossary</button>
  <span class="tab-status" id="save-status" role="status"></span>
</nav>

<p class="notice" id="notice" hidden></p>

<!-- ===================================================================== -->
<main class="frame" id="view-log">

  <!-- One set of finds, two ways of looking at them. The filters belong to the
       data, not to either rendering, so they sit above the toggle. -->
  <section class="block" id="finds-block">
    <div class="filter-row">
      <div class="filter-search"><input type="search" id="filter-q" placeholder="Search finds…" aria-label="Search finds" /></div>
      <div class="view-toggle" role="tablist" aria-label="How to show the finds">
        <button type="button" class="view-toggle-button is-on" id="mode-finds" role="tab" aria-selected="true" title="Gallery">
          <span class="view-toggle-mark" aria-hidden="true">
            <svg viewBox="0 0 12 12" width="12" height="12" fill="currentColor" aria-hidden="true">
              <rect x="0" y="0" width="5" height="5" rx="1" /><rect x="7" y="0" width="5" height="5" rx="1" />
              <rect x="0" y="7" width="5" height="5" rx="1" /><rect x="7" y="7" width="5" height="5" rx="1" />
            </svg>
          </span><span class="view-toggle-word">Gallery</span>
        </button>
        <button type="button" class="view-toggle-button" id="mode-map" role="tab" aria-selected="false" title="Map">
          <span class="view-toggle-mark" aria-hidden="true">&#8982;</span><span class="view-toggle-word">Map</span>
        </button>
      </div>
      <div class="filter-set" id="filter-type"></div>
      <div class="filter-set" id="filter-status"></div>
      <div class="filter-set" id="filter-extra"></div>
      <label class="inline-pick" id="filter-species-wrap">Species
        <select id="filter-species"></select>
      </label>
    </div>

    <div class="gallery" id="finds-gallery"></div>

    <div id="map-pane" hidden>
      <div class="map-shell"><div id="map-canvas"></div></div>
      <div class="legend" id="map-legend"></div>
    </div>

    <p class="verdict" id="finds-verdict"></p>
  </section>

  <!-- Logging a find is one action, and it is not the thing you come here to
       look at. Collapsed to its call to action until you want it. -->
  <section class="block is-collapsible" id="entry-block">
    <button type="button" class="entry-cta" id="entry-toggle" aria-expanded="false" aria-controls="entry-body">
      <span class="entry-cta-mark" aria-hidden="true">+</span>
      <span class="entry-cta-text">
        <span class="entry-cta-title">Log a find</span>
        <span class="entry-cta-note">Photos carry their own date and place. Name it later.</span>
      </span>
    </button>

    <div id="entry-body" hidden>
      <form id="obs-form">
        <div class="dropzone" id="obs-drop" tabindex="0" role="button" aria-label="Add photos">
          <span class="dropzone-title">Add photos</span>
          <span class="dropzone-note">Drop them here, or click to choose. JPEG, PNG, HEIC.</span>
        </div>
        <input type="file" id="obs-file" accept="image/*" multiple hidden />
        <div class="shot-strip" id="obs-shots"></div>

        <div class="entry-row">
          <label>Type
            <select id="obs-type"></select>
            <span class="field-hint">Naming it comes later.</span>
          </label>
          <label>When
            <input type="datetime-local" id="obs-when" />
            <span class="field-hint" id="obs-when-hint">&nbsp;</span>
          </label>
          <label>Latitude<input type="text" class="coord" id="obs-lat" inputmode="decimal" placeholder="—" /></label>
          <label>Longitude<input type="text" class="coord" id="obs-lon" inputmode="decimal" placeholder="—" /></label>
          <label class="grow">Place<input type="text" id="obs-place" placeholder="Trailside, mixed conifer" /></label>
          <label class="wide">Notes<textarea id="obs-notes" placeholder="Anything you will not remember: smell, substrate, what it was growing with…"></textarea></label>
        </div>

        <div class="form-actions">
          <span class="save-status spacer" id="obs-hint"></span>
          <button type="button" class="ghost-button" id="obs-reset">Clear</button>
          <button type="submit" class="solid-button" id="obs-submit">Log it</button>
        </div>
      </form>
    </div>
  </section>

</main>

<main class="frame" id="view-species" hidden>

  <section class="block">
    <div class="filter-row">
      <div class="filter-set" id="filter-sp-type"></div>
      <div class="filter-search"><input type="search" id="filter-sp-q" placeholder="Search species…" aria-label="Search species" /></div>
      <button type="button" class="solid-button" id="species-new" aria-label="New species">
        <span class="button-word">New species</span><span class="button-mark" aria-hidden="true">+</span>
      </button>
    </div>
    <div class="table-scroll">
      <table class="ledger">
        <thead id="species-head">
          <tr>
            <th class="nowrap"></th>
            <th data-sort="scientificName" data-col="scientificName">Name</th>
            <th class="nowrap" data-sort="kind" data-col="kind">Type</th>
            <th class="nowrap" data-sort="edibleRank" data-col="edibleRank">Edibility</th>
            <th class="is-wide">Habitat</th>
            <th class="r nowrap is-wide" data-sort="count" data-col="count">Finds</th>
            <th class="nowrap is-wide" data-sort="last" data-col="last">Last seen</th>
          </tr>
        </thead>
        <tbody id="species-rows"></tbody>
      </table>
    </div>
  </section>

</main>

<!-- ===================================================================== -->
<main class="frame" id="view-glossary" hidden>

  <section class="block">
    <div class="filter-row">
      <div class="filter-set" id="glossary-filter-cat"></div>
      <div class="filter-set" id="glossary-filter-state"></div>
      <div class="filter-search"><input type="search" id="glossary-q" placeholder="Search terms…" aria-label="Search terms" /></div>
    </div>
    <div class="table-scroll">
      <table class="ledger">
        <thead>
          <tr>
            <th>Term</th>
            <th class="nowrap">Category</th>
            <th>Definition</th>
            <th class="nowrap">Same as</th>
            <th class="r nowrap">Uses</th>
          </tr>
        </thead>
        <tbody id="glossary-rows"></tbody>
      </table>
    </div>
  </section>

</main>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>

<script src="exif.js"></script>
<script src="model.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
